<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Patient Encounter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 30px;
    }

    form {
      max-width: 400px;
      padding: 20px;
      background-color: white;
      border: 1px solid #ccc;
    }

    section {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ddd;
    }

    section h3 {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-top: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      padding: 8px 16px;
    }

    .table-section {
      max-width: 800px;
      margin-top: 24px;
      padding: 16px;
      background-color: white;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <h1>Diabetes Patient Management</h1>
  </header>

  <form action="#" method="post">
    <section>
      <h2>Add Patient Encounter</h2>

      <label for="patient-number">Patient Number</label>
      <input id="patient-number" name="patient_number" type="text" required>

      <label for="age-group">Age Group</label>
      <select id="age-group" name="age_group" required>
        <option value="">Select age group</option>
        <option value="0-10">0–10</option>
        <option value="10-20">10–20</option>
        <option value="20-30">20–30</option>
        <option value="30-40">30–40</option>
        <option value="40-50">40–50</option>
        <option value="50-60">50–60</option>
        <option value="60-70">60–70</option>
        <option value="70-80">70–80</option>
        <option value="80-90">80–90</option>
        <option value="90-100">90–100</option>
      </select>
    </section>

    <section>
      <h3>Hospital Stay</h3>
      <label for="time-in-hospital">Time in Hospital (days)</label>
      <input id="time-in-hospital" name="time_in_hospital" type="number" min="1" required>
    </section>

    <section>
      <h3>Previous Visits</h3>
      <label for="inpatient-visits">Inpatient Visits</label>
      <input id="inpatient-visits" name="inpatient_visits" type="number" min="0" required>

      <label for="emergency-visits">Emergency Visits</label>
      <input id="emergency-visits" name="emergency_visits" type="number" min="0" required>
    </section>

    <section>
      <h3>Treatment</h3>
      <label for="medications">Medications</label>
      <input id="medications" name="medications" type="number" min="0" required>
    </section>

    <button type="submit">Add Encounter</button>
  </form>
  <section class="table-section">
    <h2>Patient Encounters</h2>
    <p id="encounter-status" role="status" aria-live="polite">Loading encounters...</p>
    <table>
      <thead>
        <tr>
          <th>Patient Number</th>
          <th>Age</th>
          <th>Risk Score</th>
          <th>Risk Level</th>
        </tr>
      </thead>
      <tbody id="encounter-list"></tbody>
    </table>
  </section>
  <script>
    async function loadPatients() {
      const tableBody = document.getElementById("encounter-list");
      const status = document.getElementById("encounter-status");

      try {
        const response = await fetch("/encounters?limit=50");
        if (!response.ok) {
          throw new Error(`The server returned HTTP ${response.status}.`);
        }

        const patients = await response.json();
        if (!Array.isArray(patients)) {
          throw new Error("The server returned an unexpected response.");
        }

        tableBody.replaceChildren();
        for (const patient of patients) {
          const row = document.createElement("tr");
          for (const value of [
            patient.patient_nbr,
            patient.age,
            patient.risk_score,
            patient.risk_level
          ]) {
            const cell = document.createElement("td");
            cell.textContent = value == null ? "" : String(value);
            row.appendChild(cell);
          }
          tableBody.appendChild(row);
        }

        status.textContent = patients.length
          ? `Showing ${patients.length} encounters.`
          : "No encounters found.";
      } catch (error) {
        status.textContent = `Could not load encounters: ${error.message} Open this page at http://127.0.0.1:8000/encounter-page.`;
      }
    }

    loadPatients();
  </script>
</body>
</html>
